name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keyed on the event as well as the ref: without that, a push to main cancels an
# in-flight manual image build, which is exactly how the first qcow2 attempt died.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Evaluate every output on every system
        run: nix flake check --all-systems --show-trace

  package:
    name: build talon package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#talon --show-trace
      # A package that builds but does not execute has proved nothing.
      - name: Prove the binary runs
        run: ./result/bin/talon --version

  image:
    name: build qcow2 image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      # A hosted runner starts with ~14 GB free. A NixOS disk image plus its
      # closure does not fit; the preinstalled toolchains we will never use do.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix build .#image-qcow2 --show-trace --print-build-logs

      - name: Describe what came out
        run: |
          ls -lh result/
          du -sh result/

      - uses: actions/upload-artifact@v4
        with:
          name: talonos-qcow2
          path: result/**
          compression-level: 0
